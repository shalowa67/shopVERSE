name: Build Android app

# Builds android/ into ShopVerse.apk (direct install) and ShopVerse.aab (Google Play)
# on GitHub's servers and publishes both to the "android-app" release, which the
# website's /install page links to. Run it from the Actions tab ("Run workflow").
#
# Signing uses two repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    the signing key file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
# Without them the app is signed with a throwaway debug key; it still installs, but
# shows a browser address bar and cannot be updated in place later.

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shopverse-release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/shopverse-release.p12" >> "$GITHUB_ENV"
            echo "Using the ShopVerse release signing key."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set - building with a debug key."
          fi

      - name: Build APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Collect outputs
        id: outputs
        run: |
          mkdir -p ../android-dist
          cp app/build/outputs/apk/release/app-release.apk ../android-dist/ShopVerse.apk
          cp app/build/outputs/bundle/release/app-release.aab ../android-dist/ShopVerse.aab
          version=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*'(.*)'.*/\1/")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Keep the builds as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopVerse-Android
          path: android-dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: ShopVerse for Android ${{ steps.outputs.outputs.version }}
          body: |
            **ShopVerse.apk**: download on your Android phone and open it to install.
            Android may ask you to allow installing apps from your browser once.

            **ShopVerse.aab**: upload this one to Google Play Console if you publish on the Play Store.
          files: |
            android-dist/ShopVerse.apk
            android-dist/ShopVerse.aab
          make_latest: false
