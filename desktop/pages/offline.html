<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'" />
    <title>ShopVerse — offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      .card {
        max-width: 420px;
        padding: 36px 32px;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        box-shadow: 0 10px 30px -12px rgba(15, 23, 42, 0.18);
      }
      img { width: 64px; height: 64px; opacity: 0.9; }
      h1 { margin: 16px 0 8px; font-size: 21px; letter-spacing: -0.02em; }
      p { margin: 0; color: #64748b; font-size: 14px; line-height: 1.55; }
      button {
        margin-top: 22px;
        height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 10px;
        background: #4f46e5;
        color: #fff;
        font: 600 15px 'Segoe UI', system-ui, sans-serif;
        cursor: pointer;
      }
      button:hover { background: #4338ca; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="../build/icon.png" alt="" />
      <h1>You're offline</h1>
      <p>ShopVerse couldn't reach the marketplace. Check your internet connection and try again.</p>
      <button type="button" id="retry">Try again</button>
    </div>
    <script src="offline.js"></script>
  </body>
</html>
